---
name: Build Jochona Display Adapter

on:
  pull_request:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-tests:
    # Portable protocol/state-machine tests (src/protocol): no WDK
    # dependency, runs on any platform.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure
        run: cmake -S tests -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-driver:
    # The WDK driver build is validated against VS 2022; windows-latest is moving to VS 2026.
    # Steps live in build-driver.yml so release.yml can reuse them without drift.
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    uses: ./.github/workflows/build-driver.yml
    with:
      platform: ${{ matrix.platform }}
